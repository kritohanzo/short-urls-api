version: '3.9'

volumes:
  postgres_data:

services:
  backend:
    build: .
    container_name: short-urls-backend
    env_file: .environment
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    depends_on:
      - postgres

  postgres:
    image: postgres:18-alpine
    container_name: short-urls-postgres
    env_file: .environment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: on-failure
