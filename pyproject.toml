[project]
name = "short-urls-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.2",
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.126.0",
    "greenlet>=3.3.0",
    "pre-commit>=4.5.1",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.38.0",
]

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.flake8]
max-line-length = 120
